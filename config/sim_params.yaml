# v2 逐幀引擎（footballsim.sim）參數。MVP 預設值：移動、球物理與接觸的係數是模型假設，
# 待用追蹤資料（SkillCorner、Metrica）校準；行為模型與屬性係數沿用 engine_params.yaml / fitted360.yaml。
clock:
  dt: 0.1                       # 基礎 tick（s）
  half_seconds: 2700.0
  stoppage_seconds: [90.0, 150.0]   # MVP：固定補時（上、下半場）

motion:
  vmax_scale: 0.88              # 最高速 = v1 的 vmax × 此值（追蹤資料：第 99.9 百分位 7.9 m/s；v1 的平均球員 9.0 m/s 偏快）
  ramp: [2.0, 12.0]            # 回防、前插、逼搶的速度比例隨離目標的距離（2 m 內慢跑，14 m 以上用滿意圖的比例）
  sprint_dist: [12.0, 26.0]    # 衝向目標的意圖：離目標超過 12 m 起逐漸加速到全速，38 m 以上全速
  accel_decay: 0.0              # 加速度隨速度遞減：a = a_max × (1 − accel_decay × v / 最高速)；0 = 固定上限（與追蹤資料的 p99 包絡最吻合）
  decision_tau_scale: 2.8       # 決策函式（v1）用 sprint_time(d, vmax, tau) 估計誰先到；v1 的 tau 對應起步加速 12 m/s²，v2 實際 2.7 m/s²，換算約 3 倍
  a_max: 2.7                    # 加速度上限 m/s²（追蹤資料 0.5 秒平滑後的 p99 約 2.1–2.9）
  a_dec: 3.0                    # 減速度上限（追蹤資料 p1 約 −2.1～−3.5）
  arrive_tau: 3.0               # 接近目標時的期望速度 = 距離 / arrive_tau
  frac:                         # 各意圖的速度占最高速的比例
    hold: 0.17
    hold_far: 0.40               # 保持陣型的人離目標很遠時的速度比例
    run: 0.60
    press: 0.64
    recover: 0.66
    receive: 0.62
    chase: 0.75
    carry: 0.58
    wait: 0.38                  # 持球等待出手時的速度比例
    engage: 0.52                # 離球最近的防守者貼近持球者時的速度比例（追蹤資料：最近對手速度中位數約 4 m/s）
  energy_ref_frac: 0.30         # 平均速度比例；以 v1 的每分鐘耗能為基準，依 (速度比例 / 此值)² 調整
  refresh_every: 30.0           # 每隔幾秒依能量重算有效屬性

shape:
  period: 1.0                   # 目標點的更新週期（s）；球權或階段改變、重啟時立即更新
  smooth: 0.15                  # 目標點的指數平滑係數（每次更新往新目標移動的比例）
  engage_n: 2                   # 無球防守時，離球最近的幾人貼近持球者
  engage_dist: 2.0              # 貼身防守者站在持球者前方（球門側）多遠（m）；第二人 2.2 倍
  beaten_margin: 1.5            # 防守者在球後面超過這個距離（m）就算被越過，要趕快回到球與球門之間
  retreat_margin: 1.5           # 目標點比現在的位置更靠近本方球門超過這個距離（m）：防線要跟著球退，用貼身速度往回跑
  beaten_x: 40.0                # 球進入持球隊進攻方向 40 m 以後才適用
  engage_zone: 14.0             # 離球多近才算（m）
  defend_zone: 12.0             # 球附近這個範圍內的防守者用逼搶速度調整位置（盯人要跟得上進攻者）
  lateral_drift: 0.04           # 橫向分位數抽籤每次（每秒）的漂移幅度（v1 是每次決策 0.25）
  noise_hold: 15.0               # 位置誤差與跑位候選的亂數在這個時間窗（s）內保持不變
  near_ball: 12.0               # 目標點離球 12 m 內的人（逼搶、貼身盯人、接應）不平滑，跟著球走
  press_hold: 3.0               # 計算逼搶者位置時用的持球時間（s）；位置由運動學決定，不再受持球時間限制
  intent_period: 0.5            # 無球意圖的評估週期（s）

ball:
  pass_v0: [13.0, 0.30, 27.0]   # 地面傳球初速 = clip(a + b·距離, a, 上限)
  ground_decel: 1.3             # 地面球飛行時的減速度 m/s²
  roll_decel: 1.5               # 無主球滾動的減速度
  loft_vh: [12.0, 0.22, 28.0]   # 高球水平速度
  loft_height: [1.5, 0.10, 12.0]  # 高球最高點 = clip(a + b·距離, 2, 上限)
  shot_speed: [20.0, 0.12, 31.0]  # 射門球速 = a + b·射門複合能力，上限
  pass_err: [0.5, 0.035]        # 傳球落點誤差 σ（m）= (a + b·距離) × (1.5 − 技術/100) × (1 + 0.5·受壓)
  control_radius: 1.2           # 接球控制半徑（m）
  loose_radius: 1.1             # 無主球的搶球半徑（m）
  loose_speed: [3.0, 6.0]       # 控制失敗後球彈開的速度範圍

contest:
  intercept_reach: 0.8          # 攔截球路的基礎半徑（m）；每 +10 攔截能力 +0.12 m
  intercept_k: 0.45             # 攔截成功率的 logit：k·(攔截能力 − R)/10 − 0.10·(球速 − 12) + b0
  intercept_b0: -0.7            # 球路經過防守者身邊也不一定碰得到（模型假設，待校準）
  lofted_clear_z: 2.4           # 高球低於此高度才可能被攔截（m）
  control_b0: 2.3               # 接球控制的 logit：b0 + k·(停球 − R)/10 − speed·(到達球速 − ref) − press·受壓
  control_k: 0.40
  control_speed: 0.06
  control_speed_ref: 12.0
  control_press: 0.5
  tackle_range: 1.4             # 可搶斷的距離（m）
  tackle_rate: 0.15             # 每秒嘗試搶斷的次數（範圍內）；真實防守者多半是盯住等待，不是持續出腳
  tackle_b0: -0.9               # 搶斷成功率的 logit：b0 + k·(搶斷 − 持球者護球)/10
  tackle_k: 0.45
  duel_stun: 0.8                # 過人成功後，被過掉的防守者無法再搶斷的秒數
  free_react: 0.20              # 無主球搶球的反應時間（s）

phase:
  dt_window: 4.0                # 失球後的防守轉換窗口（s），隨反搶強度（press 1–5）與體能調整
  dt_window_press: 0.5          # press 每 +1，窗口延長的秒數
  at_window: 5.0                # 得球後的進攻轉換窗口（s）
  counter_press_n: [1, 2, 2, 3, 4]   # press 1–5 對應反搶的人數
  at_hold_factor: 0.8           # 進攻轉換窗口內持球時間縮短的比例
  counter_progress: 30.0        # 窗口內推進超過此距離（m）算反擊

rules:
  restart_delay: [2.0, 5.0]     # 出界後重啟的等待秒數
  goal_delay: 30.0              # 進球後到開球的秒數
  wait_drift: 6.0               # 持球等待出手時，目標點在前方多遠（m）
  windup: 0.25                  # 出腳前的動作時間（s）
  hold_reaction: 0.0            # 持球決策前額外的反應時間（s）
