# ---- 行為模型：要不要射門／傳中／解圍。係數由 StatsBomb 360 位置特徵擬合（fitted360.yaml 覆蓋這裡的預設值）；
#      特徵為引擎也算得出的位置量（最近對手距離、射門路線上人數），不用人工標記的「受壓迫」。k_* 為模型假設 ----
shot_propensity:
  a0: 4.5
  a_dist: -0.14
  a_logang: 2.6
  a_near: 0.18            # 最近外野防守者每遠 1 m（上限 8 m）
  align: 0.0              # 事件定義對齊（未使用）
  k_quality: 1.0          # 假設：射門傾向的 odds 與「封堵相對典型射門」的射門品質 odds 成正比
  k_dec: 1.0              # 假設：決策每 +10，對射門品質的反應放大 10%
  k_skill: 0.15           # 射手複合能力每 10 點
  k_policy: 0.3           # 戰術射門指示每 1 級
  k_trait: 0.8            # 特質「愛遠射」（距離 > 20 m）

cross_propensity:
  c0: -0.5
  c_depth: -0.12
  c_wide: 0.015
  c_near: 0.05            # 最近對手每遠 1 m（上限 8 m）
  align: 0.0              # 事件定義對齊（未使用）
  k_skill: 0.15           # 傳中複合能力每 10 點
  k_policy: 0.3           # 戰術寬度每 1 級
  k_trait: 0.8            # 特質「早傳中」

clear_propensity:         # 本方三區（x ≤ 35 m）持球時
  k0: 0.0
  k_x: -0.08
  k_wide: 0.0
  k_near: -0.3            # 最近對手越近越常解圍
  align: 0.0              # 事件定義對齊（未使用）

# 傳球對象選擇（條件 logit）：被選中的機率 ∝ exp(Σ 係數 × 特徵)。係數由 360 資料擬合（fitted360.yaml 覆蓋）；
# 「要不要傳球」仍由效用比較決定，這裡只決定「傳給誰」。特徵見 decision.pass_choice_features
pass_choice:
  enabled: true           # 傳球對象由 360 擬合的條件 logit 決定（「傳球」這一類的機率仍由效用比較）；可視範圍外的選項依 IIA 不影響係數
  dx: 0.37                # 接球者每往前 10 m
  dist: -1.6              # 傳球距離每 10 m
  dist2: 0.07             # 距離平方（/100）
  space: 1.4              # 接球者身邊空間每 5 m（上限 10 m）
  lane: -1.0              # 傳球路線攔截威脅
  back: -0.2              # 回傳（往後 > 3 m）
  gk: 0.25                # 傳給門將
  xt_gain: 0.85           # xT 增益每 0.05
  dx_own: 0.05            # 本方三區時往前的額外權重
  dx_final: 0.05          # 前場三區時往前的額外權重
  k_dec: 1.0              # 假設：決策每 +10，越接近資料中的選擇方式（係數放大 10%）
